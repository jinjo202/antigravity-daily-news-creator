name: Automated Market Reports

on:
  schedule:
    # 22:00 UTC Sun-Thu => 07:00 KST Mon-Fri
    - cron: '0 22 * * 0-4'
    # 06:00 UTC Mon-Fri => 15:00 KST Mon-Fri
    - cron: '0 6 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-reports:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daily-news-creator
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Financial Market Report (Morning)
        env:
          PERSONAL_GMAIL_USER: ${{ secrets.PERSONAL_GMAIL_USER }}
          PERSONAL_GMAIL_PASSWORD: ${{ secrets.PERSONAL_GMAIL_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        if: github.event.schedule == '0 22 * * 0-4' || github.event_name == 'workflow_dispatch'
        run: |
          python run_financial_cron.py

      - name: Run Asia Market Report (Afternoon)
        env:
          PERSONAL_GMAIL_USER: ${{ secrets.PERSONAL_GMAIL_USER }}
          PERSONAL_GMAIL_PASSWORD: ${{ secrets.PERSONAL_GMAIL_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        if: github.event.schedule == '0 6 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: |
          python run_daily_cron.py
