name: Daily Market Report Automation

on:
  push:
    branches:
      - main
  schedule:
    # 07:05 KST is 22:05 UTC of the previous day (Runs Monday-Friday KST = Sunday-Thursday UTC)
    - cron: '5 22 * * 0-4'
    # 14:22 KST is 05:22 UTC (Draft Report, Runs Monday-Friday KST = Monday-Friday UTC)
    - cron: '22 5 * * 1-5'
    # 15:43 KST is 06:43 UTC (Final Report, Runs Monday-Friday KST = Monday-Friday UTC)
    - cron: '43 6 * * 1-5'
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Report type to run (global / asia / auto)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - global
          - asia

jobs:
  run-report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./daily-news-creator
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'daily-news-creator/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Report Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PERSONAL_GMAIL_USER: ${{ secrets.PERSONAL_GMAIL_USER }}
          PERSONAL_GMAIL_PASSWORD: ${{ secrets.PERSONAL_GMAIL_PASSWORD }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python -c "
          import datetime, subprocess, sys
          
          # Get manual input or auto-detect based on current KST hour
          report_type = '${{ github.event.inputs.report_type }}'
          if not report_type or report_type == 'auto':
              # Determine KST time (UTC + 9)
              kst_now = datetime.datetime.utcnow() + datetime.timedelta(hours=9)
              kst_hour = kst_now.hour
              print(f'Current KST time: {kst_now.strftime(\"%Y-%m-%d %H:%M:%S\")}')
              if kst_hour < 12:
                  report_type = 'global'
              else:
                  report_type = 'asia'
          
          print(f'Triggered report type: {report_type}')
          
          if report_type == 'global':
              print('Running run_financial_cron.py (Global/US Market Report)...')
              subprocess.run(['python', 'run_financial_cron.py'], check=True)
          elif report_type == 'asia':
              print('Running run_daily_cron.py (Asia Market Report)...')
              subprocess.run(['python', 'run_daily_cron.py'], check=True)
          else:
              print(f'Unknown report type: {report_type}')
              sys.exit(1)
          "
